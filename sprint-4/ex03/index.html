<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Cadastro de Super-Herói</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<div class="form-container">
			<h1 class="form-container__title">
				Seja um novo Super-Herói do nosso time!
			</h1>
			<form
				class="form"
				action="/processar-formulario"
				method="POST"
			>
				<label
					class="form__label"
					for="nome"
				>
					Nome de Herói
				</label>
				<input
					type="text"
					class="form__input"
					minlength="3"
					maxlength="20"
					required
					placeholder="Digite seu nome de herói"
					id="nome"
				/>
				<label
					class="form__label"
					for="nivel"
				>
					Nível de Poder
				</label>
				<input
					type="number"
					class="form__input"
					min="1"
					max="10"
					required
					placeholder="Digite de 1 a 10 seu nível de poder"
					id="nivel"
				/>
				<label
					class="form__label"
					for="email"
				>
					E-mail
				</label>
				<input
					type="email"
					class="form__input"
					required
					placeholder="Digite seu email"
					id="email"
				/>
				<label
					class="form__label"
					for="senha"
				>
					Senha
				</label>
				<input
					type="password"
					class="form__input"
					minlength="6"
					maxlength="8"
					required
					placeholder="Digite sua senha"
					id="senha"
				/>
				<label
					class="form__label"
					for="dataNascimento"
				>
					Data de Nascimento
				</label>
				<input
					type="date"
					class="form__input"
					required
					id="dataNascimento"
				/>
				<label
					class="form__label"
					for="superpoderes"
				>
					Lista de Superpoderes
				</label>
				<textarea
					rows="4"
					cols="50"
					required
					placeholder="Digite seus superpoderes"
					class="form__textarea"
					id="superpoderes"
				></textarea>
				<label
					class="form__label"
					for="pontoForte"
				>
					Qual é o seu maior ponto forte como herói?
				</label>
				<select
					class="form__select"
					id="pontoForte"
				>
					<option
						value="Liderança"
						selected
					>
						Liderança
					</option>
					<option value="Combate">Combate</option>
					<option value="Inteligência">Inteligência</option>
				</select>
				<label class="form__label">
					Escolha um herói com quem você gostaria de fazer parceria:
				</label>
				<div class="form__radio-group">
					<label class="form__radio-label">
						<input
							type="radio"
							name="parceiro"
							value="Sentinela da Liberdade"
							class="form__radio"
							checked
						/>
						Sentinela da Liberdade
					</label>
					<label class="form__radio-label">
						<input
							type="radio"
							name="parceiro"
							value="Guerreira Superior"
							class="form__radio"
						/>
						Guerreira Superior
					</label>
					<label class="form__radio-label">
						<input
							type="radio"
							name="parceiro"
							value="Titã de Aço"
							class="form__radio"
						/>
						Titã de Aço
					</label>
				</div>
				<label
					class="form__label"
					for="termos"
				>
					Você está ciente dos termos e condições desta candidatura?
				</label>
				<div class="form__checkbox">
					<input
						type="checkbox"
						id="termos"
						class="form__checkbox-input"
					/>
					Sim, estou ciente
				</div>
				<div class="form__buttons">
					<button
						type="reset"
						class="form__button form__button--reset"
					>
						Resetar
					</button>
					<button
						type="submit"
						class="form__button form__button--submit"
						disabled
					>
						Ser um Herói
					</button>
				</div>
			</form>
		</div>
		<script src="script.js"></script>
	</body>
</html>
